apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-jili-service.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "GameRecordInfo": {
        "MongoDefine": "gp.gamerecord.database",
        "MongoGlobPattern": "tgs.gp.gamerecord.database.round.jilitf",
        "GameProviderCode": "JILITF",
        "IntervalMinute": 2,
        "PageLimit": 500
      },
      
      "GameRecord": {
        "GameProvidersQueryServerBaseUrl": "http://game-gameprovider-queryserver/",
        "GameInterfaceJiliServiceBaseUrl": "http://game-gameinterface-jili-service:9090/"
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
