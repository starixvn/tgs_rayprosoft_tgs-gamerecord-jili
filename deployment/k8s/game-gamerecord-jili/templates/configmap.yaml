apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-jili.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Warning",
          "Grpc.Net.Client.Balancer": "Debug",
          "Tgs.GameRecord.Jili.Messages.ManualMessageHandler": "Information",
          "Tgs.GameRecord.Jili.Messages.ScheduleMessageHandler": "Warning",
          "Tgs.GameRecord.Jili.Messages.ScheduleMinsMessageHandler": "Warning",
          "Tgs.GameRecord.Jili.Messages.ScheduleHourlyMessageHandler": "Warning",
          "Tgs.GameRecord.Jili.Core.JobApplicationServices.JobExecuteCommandService": "Warning",
          "Tgs.GameRecord.Jili.Core.JobApplicationServices.JobExecute30MinsCommandService": "Warning",
          "Tgs.GameRecord.Jili.Core.JobApplicationServices.JobExecuteHourlyCommandService": "Warning",
          "Tgs.GameRecord.Jili.Core.ApplicationServices.HandleRecordCommandService": "Warning"
        }
      },
      "GameRecord": {
        "GameCommandClientBaseUrl": "http://game-gamecommand/",
        "GameInterfaceClientBaseUrl": "dns:///game-gameinterface-jili:9090/"
      },
      "GameRecordInfo": {
        "GameProviderCode": "JILITF",
        "GameProviderConfiguration": "JILITFConfiguration",
        "HangfirePrefix": "gamerecord-jili-hangfire:",
        "HangfireLocking": "gamerecord-jili-locking:",
        "IntervalMinutes": 10,
        "IntervalMinutesMax": 10,
        "IntervalMinutesMinimum": 1,
        "PageLimit": 10000
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]
