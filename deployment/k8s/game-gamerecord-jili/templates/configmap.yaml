apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-jili.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Warning"
        }
      },
      "GameRecord": {
        "GameCommandClientBaseUrl": "http://game-gamecommand/",
        "GameRoundsScheduleClientBaseUrl": "http://game-gamerounds-schedule:9090/",
        "GameInterfaceClientBaseUrl": "dns:///game-gameinterface-jili:9090/"
      },
      "GameRecordInfo": {
        "GameProviderCode": "JILITF",
        "GameProviderConfiguration": "JILITFConfiguration",
        "GameProviderHangfire": "jilitf-schedule:hangfire:",
        "IntervalMinutes": 7,
        "IntervalMinutesMax": 10,
        "IntervalMinutesMinimum": 1,
        "PageLimit": 10000
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]
